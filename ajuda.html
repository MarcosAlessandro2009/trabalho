        }



        header {
            background-color:rgb(2, 136, 156);
            padding: 1rem;
            color: white;
            text-align: center;
        }



        header nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        header nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2rem;
            transition: color 0.3s;
        }

        header nav a:hover {
            color: #ddd;
        }

        /* Estilos para o conteúdo principal */
        main {
            flex: 1; /* Faz com que o conteúdo principal ocupe o espaço restante */
            padding: 2rem;
            text-align: center;
        }

        /* Estilos para o rodapé */
        footer {
            background-color: #f0f0f0;
            padding: 2rem;
            text-align: center;
            color: #555;
        }

        .footer-photos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Permite que as fotos quebrem a linha em telas menores */
            gap: 15px; /* Espaço entre as fotos */
            margin-top: 20px;
        }

        .footer-photos img {
            width: 150px;
            height: 150px;
            object-fit: cover; /* Garante que a imagem preencha o espaço sem distorção */
            border-radius: 8px; /* Cantos arredondados */
            box-shadow: 0 4px 8px rgb(2, 133, 156); /* Sombra para dar profundidade */
            transition: transform 0.3s;
        }

        .footer-photos img:hover {
            transform: scale(1.05); /* Efeito de zoom ao passar o mouse */
        }

        footer p {
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .logo{
            width: 70px;
            height: 70px;





        }
